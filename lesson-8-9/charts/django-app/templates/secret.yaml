apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | quote }}
  {{- if and .Values.externalDatabase.enabled .Values.externalDatabase.password }}
  POSTGRES_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  {{- end }}
