replicaCount: 1

image:
  repository: 851092642046.dkr.ecr.us-west-2.amazonaws.com/django-app
  tag: "8"
  pullPolicy: Always

resources:
  requests:
    cpu: "50m"
    memory: "96Mi"
  limits:
    cpu: "200m"
    memory: "192Mi"

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Open environment variables (used when externalDatabase.enabled is false)
config:
  DEBUG: True
  ALLOWED_HOSTS: localhost,127.0.0.1,django,web,*
  POSTGRES_DB: django_db
  POSTGRES_USER: django_user
  DB_HOST: db
  DB_PORT: 5432

# Sensitive environment variables (Kubernetes Secret)
secrets:
  SECRET_KEY: your-secret-key-here
  POSTGRES_PASSWORD: your-db-password-here

ingress:
  enabled: false
  className: nginx
  host: yourdomain.com
  path: /
  pathType: Prefix
  tls: true

# Managed AWS RDS / Aurora integration
externalDatabase:
  enabled: true
  host: "django-app-dev-rds.c14ayakww674.us-west-2.rds.amazonaws.com"
  port: 5432
  name: "djangodb"
  user: "dbadmin"
  password: "" # Pass via Helm --set externalDatabase.password=... or K8s Secret
