controller:
  serviceType: LoadBalancer
  servicePort: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest

persistence:
  enabled: true
  size: "8Gi"
  storageClass: "gp3"

agent:
  enabled: true
  podTemplates:
    kaniko-git: |
      - name: kaniko-git
        label: kaniko-git
        serviceAccount: jenkins
        containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:debug
            command: "sleep"
            args: "99d"
          - name: git
            image: alpine/git:latest
            command: "sleep"
            args: "99d"

serviceAccount:
  create: true
  name: jenkins
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::851092642046:role/lesson-8-eks-jenkins-ecr-role"
