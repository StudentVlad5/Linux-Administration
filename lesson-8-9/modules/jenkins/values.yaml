controller:
  serviceType: LoadBalancer
  servicePort: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - job-dsl:latest
  additionalExistingSecrets:
    - name: jenkins-github-secret
      keyName: username
    - name: jenkins-github-secret
      keyName: token
  JCasC:
    configScripts:
      github-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-creds"
                      username: "$${jenkins-github-secret-username}"
                      password: "$${jenkins-github-secret-token}"
                      description: "GitHub PAT for CI/CD"
      seed-job: |
        jobs:
          - script: >
              pipelineJob('django-app-ci') {
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('${gitops_repo_url}')
                          credentials('github-creds')
                        }
                        branch('*/lesson-8-9')
                      }
                    }
                    scriptPath('lesson-8-9/app/Jenkinsfile')
                  }
                }
              }

persistence:
  enabled: true
  size: "8Gi"
  storageClass: "gp3"

agent:
  enabled: true
  podTemplates:
    kaniko-git: |
      - name: kaniko-git
        label: kaniko-git
        serviceAccount: jenkins
        containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:debug
            command: "sleep"
            args: "99d"
          - name: git
            image: alpine/git:latest
            command: "sleep"
            args: "99d"

serviceAccount:
  create: true
  name: jenkins
  annotations:
    eks.amazonaws.com/role-arn: "${jenkins_ecr_role_arn}"